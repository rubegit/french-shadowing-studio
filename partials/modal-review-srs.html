<div id="review-backdrop" class="review-backdrop" onmousedown="if (event.target === this) closeReviewScreen()">
    <div class="review-card" role="dialog" aria-modal="true">
      <div class="review-head">
        <div class="review-title"><i data-lucide="brain" class="w-4 h-4" style="color:#4ade80"></i><span id="review-title-text">Ôn tập từ vựng</span></div>
        <button type="button" class="review-close" onclick="closeReviewScreen()" title="Đóng (Esc)"><i data-lucide="x"></i></button>
      </div>
      <div id="review-body"></div>
    </div>
  </div>
