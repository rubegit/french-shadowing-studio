<div id="screen-vocab" class="hidden">
    <div class="vocab-wrap">
      <div class="vocab-top">
        <div class="vocab-top-header">
          <button type="button" class="vocab-btn vocab-back-btn" onclick="closeVocabScreen()"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i><span>Quay lại</span></button>
          <h2><i data-lucide="bookmark" class="w-5 h-5 fs-text-warn"></i>Từ vựng đã lưu <span class="vocab-count-pill" id="vocab-count">0</span></h2>
        </div>
        <div class="vocab-actions">
          <button type="button" id="vocab-auto-align-btn" class="vocab-btn primary" onclick="autoAlignVocabTimestamps()" title="Tự động đối chiếu phụ đề và căn mốc thời gian cho các từ vựng chưa có mốc">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><span>Căn mốc tự động</span><span id="vocab-unaligned-badge" class="vocab-unaligned-badge" style="display:none">0</span>
          </button>
          <button type="button" id="vocab-practice-btn" class="vocab-btn primary" onclick="if(window.openVocabPracticeHub) window.openVocabPracticeHub(vocabSource, vocabLevelFilter)" title="Trung tâm luyện tập: Trắc nghiệm 4 đáp án, Nghe điền từ, Ghép thẻ nhanh, Flashcard 3D">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><line x1="6" x2="10" y1="12" y2="12"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="15" x2="15.01" y1="13" y2="13"/><line x1="18" x2="18.01" y1="11" y2="11"/><rect width="20" height="12" x="2" y="6" rx="6"/></svg><span>Luyện tập</span><span id="vocab-due-badge-1" class="vocab-due-badge" style="display:none">0</span>
          </button>
          <button type="button" class="vocab-btn primary" onclick="openVocabMeaningModal()" title="Nhờ AI điền nghĩa riêng và 3 ví dụ cho các từ chưa có"><i data-lucide="languages" class="w-3.5 h-3.5"></i><span>Điền nghĩa (AI)</span><span id="vocab-missing-badge" class="vocab-missing-badge" style="display:none">0</span></button>
          <button type="button" class="vocab-btn primary" onclick="exportVocabCsv()" title="Xuất file CSV để nhập vào Anki / Excel"><i data-lucide="download" class="w-3.5 h-3.5"></i><span>Xuất CSV</span></button>
          <button type="button" class="vocab-btn primary" onclick="openVocabImportModal()" title="Nhập danh sách từ vựng .txt hoặc JSON để đối chiếu xem trước (Dry-run)"><i data-lucide="upload" class="w-3.5 h-3.5"></i><span>Import (Xem trước)</span></button>
          <button type="button" id="vocab-del-scope-btn" class="vocab-btn danger" style="display:none" onclick="deleteCurrentScopedVocab()"><i data-lucide="trash" class="w-3.5 h-3.5"></i><span id="vocab-del-scope-text">Xóa từ bài này</span></button>
          <button type="button" class="vocab-btn danger" onclick="clearAllVocab()"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span>Xoá tất cả</span></button>
        </div>
      </div>
      <div class="vocab-toolbar">
        <input id="vocab-search" class="vocab-search" type="text" placeholder="Tìm theo từ, ngữ cảnh, bản dịch, tên video..." oninput="vocabQuery = this.value; renderVocabPage()" />
        <select id="vocab-source" class="vocab-select vocab-source" aria-label="Lọc từ vựng theo video, bài viết hoặc sách" title="Lọc theo video / bài viết / sách" onchange="vocabSource = this.value; renderVocabPage()">
          <option value="all">Tất cả bài học</option>
        </select>
        <select id="vocab-level" class="vocab-select" aria-label="Lọc từ vựng theo cấp độ CEFR" title="Lọc theo cấp độ CEFR" onchange="vocabLevelFilter = this.value; renderVocabPage()">
          <option value="all">Tất cả cấp độ</option>
          <option value="A1">Cấp A1</option>
          <option value="A2">Cấp A2</option>
          <option value="A2+">Cấp A2+</option>
          <option value="B1">Cấp B1</option>
          <option value="B2">Cấp B2</option>
          <option value="C1">Cấp C1</option>
          <option value="C2">Cấp C2</option>
        </select>
        <select class="vocab-select" onchange="vocabSort = this.value; renderVocabPage()">
          <option value="new">Mới nhất</option><option value="old">Cũ nhất</option><option value="az">A → Z</option>
        </select>
      </div>
      <div id="vocab-list"></div>
    </div>
  </div>
