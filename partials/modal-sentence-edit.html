<div id="sentence-edit-modal" class="ai-modal-backdrop" onmousedown="if (event.target === this) closeSentenceEditModal()">
  <div class="ai-modal" role="dialog" aria-modal="true" aria-labelledby="se-title" style="max-width:540px">
    <div class="ai-modal-head">
      <div id="se-title" class="ai-modal-title">Sửa câu phụ đề</div>
      <button type="button" class="ai-modal-close" onclick="closeSentenceEditModal()" title="Đóng (Esc)">
        <i data-lucide="x"></i>
      </button>
    </div>
    <p id="se-desc" class="ai-step-text" style="margin-bottom:12px">Sửa lỗi chính tả tiếng Pháp hoặc bản dịch tiếng Việt của câu này. App sẽ tự động cập nhật và lưu vào lịch sử:</p>

    <label class="block text-xs font-semibold fs-text-subtle mb-1.5">Câu tiếng Pháp:</label>
    <textarea id="se-text-fr" class="ai-textarea" style="min-height:75px;font-family:inherit" spellcheck="false" placeholder="Nhập câu tiếng Pháp đã sửa..."></textarea>

    <label id="se-label-vi" class="block text-xs font-semibold fs-text-subtle mb-1.5 mt-3">Bản dịch tiếng Việt (tùy chọn):</label>
    <textarea id="se-text-vi" class="ai-textarea" style="min-height:65px;font-family:inherit" spellcheck="false" placeholder="Bản dịch tiếng Việt tương ứng..."></textarea>

    <div class="ai-actions" style="margin-top:16px;align-items:center;justify-content:space-between">
      <div class="flex items-center gap-2">
        <button type="button" class="ai-btn ai-btn-primary" onclick="saveSentenceEdit()">
          <i data-lucide="check"></i><span>Lưu thay đổi</span>
        </button>
        <button type="button" class="ai-btn ai-btn-ghost" onclick="closeSentenceEditModal()">Hủy</button>
      </div>
      <span class="text-[11px] fs-text-muted hidden sm:inline">Phím tắt: <b>Cmd/Ctrl + Enter</b> để lưu</span>
    </div>
  </div>
</div>
