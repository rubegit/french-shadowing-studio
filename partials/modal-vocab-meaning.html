<div id="vocab-meaning-modal" class="ai-modal-backdrop" onmousedown="if (event.target === this) closeVocabMeaningModal()">
    <div class="ai-modal" role="dialog" aria-modal="true">
      <div class="ai-modal-head">
        <div class="ai-modal-title">Điền nghĩa riêng cho từ vựng</div>
        <button type="button" class="ai-modal-close" onclick="closeVocabMeaningModal()" title="Đóng (Esc)"><i data-lucide="x"></i></button>
      </div>
      <p id="vm-desc" class="ai-step-text">Đang kiểm tra...</p>
      <div class="ai-copy-row">
        <button type="button" id="vm-copy-btn" class="ai-btn ai-btn-copy" onclick="copyVocabMeaningPrompt(this)">
          <i data-lucide="copy"></i><span>Copy prompt</span>
        </button>
        <span class="ai-open-links"><a class="ai-btn ai-open-link" href="https://gemini.google.com/app" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="gmg-vm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs><path fill="url(#gmg-vm)" d="M12 0C12 6.63 6.63 12 0 12c6.63 0 12 5.37 12 12 0-6.63 5.37-12 12-12-6.63 0-12-5.37-12-12z"/></svg><span>Mở Gemini</span></a><a class="ai-btn ai-open-link" href="https://claude.ai/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#d97757"><rect x="10.8" y="1" width="2.4" height="22" rx="1.2"/><rect x="10.8" y="1" width="2.4" height="22" rx="1.2" transform="rotate(45 12 12)"/><rect x="10.8" y="1" width="2.4" height="22" rx="1.2" transform="rotate(90 12 12)"/><rect x="10.8" y="1" width="2.4" height="22" rx="1.2" transform="rotate(135 12 12)"/></g></svg><span>Mở Claude</span></a></span>
      </div>
      <textarea id="vm-textarea" class="ai-textarea" spellcheck="false" placeholder="Dán câu trả lời của AI vào đây (mỗi mục gồm dòng 'N. Nghĩa: ...' và 3 dòng VD...)"></textarea>
      <div class="ai-actions">
        <button type="button" class="ai-btn ai-btn-primary" onclick="applyVocabMeaningAnswer()">
          <i data-lucide="check"></i><span>Áp dụng</span>
        </button>
        <button type="button" class="ai-btn ai-btn-ghost" onclick="closeVocabMeaningModal()">Đóng</button>
      </div>
      <div id="vm-status" class="ai-status"></div>
    </div>
  </div>
