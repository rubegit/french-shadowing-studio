<div id="screen-practice" class="hidden h-screen flex flex-col overflow-hidden bg-[#070b14]">
    <header class="h-14 border-b border-blue-950/70 bg-[#091024] px-3 sm:px-4 flex items-center justify-between shrink-0 z-30 gap-2">
      <!-- CỤM NÚT TRÁI -->
      <div class="flex items-center gap-2 sm:gap-2.5 flex-nowrap shrink-0">
        <button
          onclick="backToInputScreen()"
          class="flex items-center gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg bg-blue-950/80 hover:bg-blue-900 border border-blue-800/80 text-blue-300 hover:text-white text-xs font-semibold transition-all cursor-pointer shadow-xs shrink-0 whitespace-nowrap btn-interactive"
        >
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span id="practice-back-btn-label" class="hidden sm:inline">Luyện video khác</span>
        </button>
        <div class="h-4 w-[1px] bg-slate-800 hidden md:block"></div>
        

        <button type="button" class="vocab-btn primary" onclick="openVocabScreen('lesson')" title="Xem từ vựng đã lưu của bài học này">
          <i data-lucide="bookmark" class="w-3.5 h-3.5"></i><span class="hidden sm:inline">Từ vựng</span>
          <span class="vocab-count-badge vocab-count-pill" style="display:none">0</span>
          <span id="vocab-due-badge-3" class="vocab-due-badge" style="display:none">0</span>
        </button>
        <button type="button" class="cloud-sync-btn practice-sync-btn" onclick="openCloudSyncModal()" title="Đồng bộ đám mây (Supabase)">
          <i data-lucide="cloud" class="w-3.5 h-3.5"></i>
          <span class="cloud-sync-dot disconnected"></span>
        </button>
        <button type="button" class="fs-theme-toggle practice-theme-btn" onclick="toggleFsTheme()" title="Chuyển chế độ Sáng / Tối" aria-label="Chuyển chế độ Sáng / Tối">
          <svg class="fs-theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg class="fs-theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <div class="h-4 w-[1px] bg-slate-800 hidden md:block"></div>

        <!-- ĐỔI GIAO DIỆN LUYỆN TẬP: Mặc định / Shadowing / Chép chính tả -->
        <div class="pv-switch" id="pv-switch">
          <button type="button" id="pv-switch-btn" class="pv-switch-btn" aria-haspopup="menu" aria-expanded="false" onclick="pvToggleMenu(event)" title="Đổi giao diện luyện tập">
            <span class="pv-sw-ico" id="pv-sw-ico"></span>
            <span class="pv-sw-label"><small>Giao diện</small><b id="pv-sw-name">Mặc định</b></span>
            <svg class="pv-sw-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="pv-menu pv-x" id="pv-menu" role="menu" aria-label="Chọn giao diện luyện tập">
            <div class="pv-menu-title">Chọn giao diện luyện tập</div>
            <button type="button" class="pv-opt active" data-v="default" role="menuitemradio" aria-checked="true" onclick="pvSetView('default')">
              <span class="pv-opt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="m10 7.5 4.5 2.5-4.5 2.5z"/></svg></span>
              <span><span class="pv-opt-name">Mặc định</span><span class="pv-opt-desc" style="display:block">Video và phụ đề karaoke, song ngữ, tra từ, thu âm so sánh giọng</span></span>
              <svg class="pv-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <button type="button" class="pv-opt" data-v="shadowing" role="menuitemradio" aria-checked="false" onclick="pvSetView('shadowing')">
              <span class="pv-opt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg></span>
              <span><span class="pv-opt-name">Shadowing</span><span class="pv-opt-desc" style="display:block">Chỉ nghe, không hiện video: nghe mẫu rồi thu âm nhại theo từng câu</span></span>
              <svg class="pv-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <button type="button" class="pv-opt" data-v="dictation" role="menuitemradio" aria-checked="false" onclick="pvSetView('dictation')">
              <span class="pv-opt-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>
              <span><span class="pv-opt-name">Chép chính tả</span><span class="pv-opt-desc" style="display:block">Nghe từng câu, gõ lại, chấm điểm từng từ và theo dõi tiến độ</span></span>
              <svg class="pv-opt-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- CỤM NÚT PHẢI: ĐIỀU CHỈNH PHỤ ĐỀ (chỉ hiện ở giao diện Mặc định) -->
      <div id="practice-header-tools" class="flex items-center gap-2 sm:gap-2.5 flex-nowrap justify-end shrink overflow-x-auto min-w-0" style="scrollbar-width:none;-ms-overflow-style:none;">
        
        <!-- NÚT GỘP: CỠ CHỮ + GIÃN DÒNG PHỤ ĐỀ -->
        <div class="fs-wrap" id="fs-wrap">
          <button type="button" id="fs-btn" class="fs-btn" aria-haspopup="true" aria-expanded="false" onclick="toggleTextSizePanel(event)" title="Chỉnh cỡ chữ và giãn dòng phụ đề">
            <span>Aa</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="fs-pop pv-x" id="fs-pop" role="dialog" aria-label="Chỉnh cỡ chữ và giãn dòng phụ đề">
            <div class="fs-row">
              <span class="fs-lbl">Cỡ chữ</span>
              <div class="fs-grp">
                <button type="button" onclick="changeSubtitleFontSize(-1.5)" title="Giảm cỡ chữ">A-</button>
                <button type="button" class="fs-reset blue" onclick="resetSubtitleFontSize()" title="Đặt về cỡ chữ mặc định">Mặc định</button>
                <button type="button" onclick="changeSubtitleFontSize(1.5)" title="Tăng cỡ chữ">A+</button>
              </div>
            </div>
            <div class="fs-row">
              <span class="fs-lbl">Giãn dòng</span>
              <div class="fs-grp">
                <button type="button" onclick="changeSubtitleLineHeight(-0.06)" title="Giảm giãn dòng">L-</button>
                <button type="button" class="fs-reset amber" onclick="resetSubtitleLineHeight()" title="Đặt về giãn dòng mặc định">Mặc định</button>
                <button type="button" onclick="changeSubtitleLineHeight(0.06)" title="Tăng giãn dòng">L+</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 0. Phiên âm IPA dưới từng chữ ở thẻ phụ đề Anh (chỉ máy tính + iPad ngang) -->
        <button type="button" id="cs-ipa" class="cs-ipa on btn-interactive" aria-pressed="true" title="Hiện / ẩn phiên âm IPA dưới từng chữ ở thẻ phụ đề">IPA</button>

        <!-- 1. Karaoke -->
        <button
          id="btn-toggle-karaoke"
          onclick="toggleKaraokeMode()"
          title="Chạy chữ Karaoke theo từng từ phát âm"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-red-600/30 text-red-200 border-red-500/60 glow-red shrink-0 whitespace-nowrap btn-interactive"
        >
          <i data-lucide="sparkles" class="w-3.5 h-3.5 text-red-400"></i>
          <span>Karaoke</span>
        </button>

        <!-- 2. Song ngữ (Anh - Việt). Mặc định: TẮT -->
        <div class="inline-flex items-center gap-1 shrink-0">
          <button
            id="btn-toggle-bilingual"
            onclick="toggleBilingual()"
            title="Hiện bản dịch tiếng Việt dưới mỗi câu tiếng Pháp"
            class="btn-interactive flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-slate-800 hover:bg-slate-700 text-slate-400 border-slate-700 shrink-0 whitespace-nowrap"
          >
            <i data-lucide="languages" class="w-3.5 h-3.5"></i>
            <span>Song ngữ</span>
          </button>
          <button
            id="btn-edit-bilingual"
            onclick="openBilingualModal(true)"
            title="Thay hoặc xóa bản dịch song ngữ"
            class="icon-only-btn edit-bl-btn"
          >
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- 3. Tự dừng cuối câu (Mặc định: TẮT) -->
        <button
          id="btn-toggle-autostop"
          onclick="toggleSentenceAutoStop()"
          title="Tự động dừng sau mỗi câu để nhại theo (Shadowing)"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-slate-800 hover:bg-slate-700 text-slate-400 border-slate-700 shrink-0 whitespace-nowrap btn-interactive"
        >
          <i data-lucide="pause-circle" class="w-3.5 h-3.5"></i>
          <span>Tự dừng</span>
        </button>

        <!-- 4. Auto scroll (Mặc định: TẮT) -->
        <button
          id="btn-toggle-autoscroll"
          onclick="toggleAutoScroll()"
          title="Tự động cuộn theo tiến trình video (Auto scroll)"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-slate-800 hover:bg-slate-700 text-slate-400 border-slate-700 shrink-0 whitespace-nowrap btn-interactive"
        >
          <i data-lucide="arrow-down-up" class="w-3.5 h-3.5"></i>
          <span class="htool-scroll-txt">Auto scroll</span>
        </button>

        <!-- 5. Thêm dấu câu (cho phụ đề chưa có dấu câu, không cần song ngữ) -->
        <button
          id="btn-punct"
          onclick="openPunctModal()"
          title="Nhờ AI thêm dấu câu và chia câu ngắn cho phụ đề (không dịch)"
          class="btn-interactive flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-slate-800 hover:bg-slate-700 text-slate-400 border-slate-700 shrink-0 whitespace-nowrap"
        >
          <i data-lucide="case-sensitive" class="w-3.5 h-3.5"></i>
          <span class="htool-opt-txt">Thêm dấu câu</span>
        </button>

        <!-- 6. Từ vựng khó (AI tổng hợp) — dùng cho cả video và bài đọc -->
        <button
          id="btn-keyvocab"
          onclick="openKeyVocabModal()"
          title="Nhờ AI liệt kê từ vựng, cụm từ, thành ngữ, tiếng lóng tiếng Pháp trong bài này, kèm nghĩa và 3 ví dụ tiếng Pháp"
          class="btn-interactive flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-slate-800 hover:bg-slate-700 text-slate-400 border-slate-700 shrink-0 whitespace-nowrap"
        >
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span class="htool-opt-txt">Từ khó</span>
        </button>

        <!-- 7. Thi thử TCF (AI) — Mô phỏng đề thi nghe TCF Compréhension Orale từ nội dung bài -->
        <button
          id="btn-tcf-exam"
          onclick="window.TcfExam && window.TcfExam.openModal()"
          title="Mô phỏng thi nghe TCF Canada (Compréhension Orale) dựa trên nội dung bài này"
          class="btn-interactive flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold border cursor-pointer transition-all bg-gradient-to-r from-red-600/25 to-blue-600/25 hover:from-red-600/40 hover:to-blue-600/40 text-blue-200 border-blue-500/40 shrink-0 whitespace-nowrap shadow-xs"
        >
          <span style="font-size:12px">🇨🇦</span>
          <span style="font-weight:700" class="htool-opt-txt">Thi thử TCF</span>
          <span style="font-weight:700;display:none" class="htool-opt-short">TCF</span>
        </button>
      </div>
          <div id="pv-header-title" class="pv-header-title pv-x" aria-live="polite"></div>
          <!-- Nút của giao diện Shadowing (chỉ hiện khi đang ở Shadowing) -->
          <div id="sh-header-tools" class="sh-htools">
            <button type="button" class="dc-chip2" id="sh-tr">Dịch nghĩa</button>
            <button type="button" class="dc-chip2" id="sh-ipa" title="Hiện phiên âm IPA ngay dưới từng từ của câu đang mở (lần đầu bấm sẽ tải từ điển phát âm)">Phiên âm IPA</button>
            <button type="button" class="dc-chip2" id="sh-hide" title="Ẩn toàn bộ chữ (thành dấu •) để luyện nghe; bấm lại để hiện chữ (phím H)">Ẩn chữ</button>
          </div>
    </header>

    <div id="pv-default" class="flex-1 min-h-0 w-full p-2.5 sm:p-3.5 overflow-hidden">
      <!-- CẤU TRÚC RESIZABLE SPLIT PANE -->
      <div id="split-container" class="split-layout-container">
        
        <!-- NỬA TRÁI: VIDEO & BẢNG ĐIỀU KHIỂN ĐÃ ĐƯỢC MỞ RỘNG SPACING THÔNG THOÁNG -->
        <div id="panel-left" class="split-panel-left space-y-3.5 pr-0 lg:pr-1.5">
          <div id="video-frame-wrapper" class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl shrink-0">
            <div id="yt-player-container" class="w-full h-full"></div>
            <div id="vid-fade" aria-hidden="true"></div>
            <!-- Lớp phủ trong suốt: chuột không chạm vào iframe YouTube nên YouTube không hiện thanh timeline, tên video, nút loa/CC... Bấm vào = phát / dừng -->
            <div id="vid-shield" onclick="togglePlay()" aria-hidden="true"></div>
            <!-- Phụ đề đè lên video: tiếng Pháp + tiếng Việt (khi bật Song ngữ), mỗi loại tối đa 2 dòng, quá dài thì có dấu ... -->
            <div id="vid-subs" aria-live="off"><div id="vid-vi" class="vid-line"><span></span></div></div>
          </div>

          <!-- BẢNG ĐIỀU KHIỂN: THÔNG THOÁNG, KHÔNG BỊ BÍ DÍNH -->
          <div id="pv-ctl" class="bg-[#091024] border border-slate-800 rounded-2xl px-4 py-2.5 shadow-md shrink-0">
            <!-- HÀNG 1: CÁC NÚT ĐIỀU KHIỂN CHÍNH (ĐỆM DƯỚI RÕ RÀNG VỚI ĐƯỜNG KẺ) -->
            <div class="pc">
                <!-- THANH TIMELINE (tự vẽ: thanh của YouTube đã bị lớp phủ chặn) -->
                <div id="tl" class="tl" aria-label="Thanh thời gian video">
                  <span class="tl-time cur" id="tl-cur">0:00</span>
                  <div class="tl-track" id="tl-track" role="slider" aria-label="Tua video" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                    <div class="tl-rail"><div class="tl-buf" id="tl-buf"></div><div class="tl-hov" id="tl-hov"></div><div class="tl-fill" id="tl-fill"></div></div>
                    <div class="tl-thumb" id="tl-thumb"></div>
                    <div class="tl-tip" id="tl-tip">0:00</div>
                  </div>
                  <span class="tl-time" id="tl-dur">0:00</span>
                </div>
              <!-- MỘT HÀNG DUY NHẤT: [CC] [Thu âm] [Tốc độ] [0.5x 0.75x 0.9x 1.0x]. Không bao giờ xuống dòng: JS đo bề rộng thật rồi chọn bậc hiển thị vừa nhất (xem pcFit) -->
              <!-- NÚT PLAY/PAUSE: dáng logo YouTube, đỏ đậm, gradient nhẹ -->
                <button type="button" id="btn-toggle-play" onclick="togglePlay()" title="Phát / Dừng (Space)" aria-label="Phát / Dừng" class="tp-play" hidden style="display:none">
                  <svg class="tp-body" viewBox="0 0 68 48" preserveAspectRatio="none" aria-hidden="true">
                    <defs>
                      <linearGradient id="tpBody" x1="0" y1="0" x2="0" y2="1"><stop class="tp-s1" offset="0"/><stop class="tp-s2" offset="1"/></linearGradient>
                      <linearGradient id="tpEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".30"/></linearGradient>
                    </defs>
                    <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55C3.97 2.33 2.27 4.81 1.48 7.74C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24S67.94 13.05 66.52 7.74z" fill="url(#tpBody)"/>
                    <path class="tp-edge" d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55C3.97 2.33 2.27 4.81 1.48 7.74C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24S67.94 13.05 66.52 7.74z" fill="none" stroke-width="1" vector-effect="non-scaling-stroke"/>
                  </svg>
                  <svg class="tp-glyph" viewBox="0 0 24 24" aria-hidden="true">
                    <path class="tp-ic-play" d="M9.6 6.8v10.4L18 12z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                    <g class="tp-ic-pause" fill="#fff"><rect x="7" y="6" width="3.8" height="12" rx="1.2"/><rect x="13.2" y="6" width="3.8" height="12" rx="1.2"/></g>
                  </svg>
                </button>
              <div class="pc-r1">
                <!-- NÚT CC: bật/tắt phụ đề Anh - Việt trên video + chỉnh cỡ chữ riêng cho phụ đề trên video -->
                <div class="cc-wrap" id="cc-wrap">
                  <button type="button" id="cc-btn" class="cc-btn" aria-haspopup="true" aria-expanded="false" title="Phụ đề trên video" aria-label="Phụ đề trên video">CC</button>
                  <div class="cc-pop pv-x" id="cc-pop" role="dialog" aria-label="Phụ đề trên video">
                    <button type="button" class="cc-row" id="cc-vi" role="switch" aria-checked="true"><span class="cc-lbl">Phụ đề Việt<small id="cc-vi-note"></small></span><span class="cc-sw"></span></button>
                    <div class="cc-sep"></div>
                    <div class="cc-row cc-size"><span class="cc-lbl">Cỡ chữ</span>
                      <div class="cc-step"><button type="button" id="cc-dec" title="Giảm cỡ chữ phụ đề trên video" aria-label="Giảm cỡ chữ">A-</button><output id="cc-val">19</output><button type="button" id="cc-inc" title="Tăng cỡ chữ phụ đề trên video" aria-label="Tăng cỡ chữ">A+</button></div>
                    </div>
                    <button type="button" class="cc-hint" id="cc-hint"></button>
                  </div>
                </div>

                <div class="pv-rec" id="pv-rec"></div>

                <!-- TỐC ĐỘ PHÁT: ô hiển thị lớn (gõ số bất kỳ 0.25 - 2 rồi Enter) + 2 nút tam giác nhỏ ▼ / ▲ chỉnh từng 0.1 -->
                <div class="rate-ctl big" title="Tốc độ phát: gõ số bất kỳ từ 0.25 đến 2 rồi bấm Enter, hoặc nhấn giữ rồi kéo lên/xuống để tăng/giảm (↑/↓ chỉnh từng 0.1)">
                  <span class="rate-input-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
                    <input id="rate-input" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" maxlength="5" value="1.0" aria-label="Tốc độ phát" onfocus="this.select()" onkeydown="rateInputKey(event)" onblur="commitRateInput()">
