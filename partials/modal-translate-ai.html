<div id="vt-ai-modal" class="ai-modal-backdrop" style="display:none;" onmousedown="if(event.target===this)vtCloseAI()">
  <div class="ai-modal" role="dialog" aria-modal="true" aria-labelledby="vt-ai-title">
    <div class="ai-modal-head">
      <h3 class="ai-modal-title" id="vt-ai-title">Nhờ AI dịch Việt → Pháp</h3>
      <button type="button" id="vt-ai-btn-close" class="ai-modal-close" onclick="vtCloseAI()" title="Đóng (Esc)" aria-label="Đóng hộp thoại"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <p class="ai-step-text" id="vt-ai-desc"></p>
    <button type="button" id="vt-ai-btn-copy" class="ai-btn ai-btn-copy" onclick="vtCopyPrompt(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy prompt</span></button>
    <textarea id="vt-ai-text" class="ai-textarea" spellcheck="false" placeholder="Dán câu trả lời của AI vào đây (mỗi câu gồm: số thứ tự, dòng S: sát nghĩa, dòng T: thoáng)..."></textarea>
    <div class="ai-actions">
      <button type="button" id="vt-ai-btn-apply" class="ai-btn ai-btn-primary" onclick="vtApplyAI()"><span>Áp dụng bản dịch</span></button>
      <button type="button" id="vt-ai-btn-cancel" class="ai-btn ai-btn-ghost" onclick="vtCloseAI()">Để sau</button>
    </div>
    <div id="vt-ai-status" class="ai-status"></div>
  </div>
</div>
