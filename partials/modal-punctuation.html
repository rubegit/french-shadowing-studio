<div id="punct-modal" class="ai-modal-backdrop" onmousedown="if (event.target === this) closePunctModal()">
    <div class="ai-modal" role="dialog" aria-modal="true" aria-labelledby="pc-title">
      <div class="ai-modal-head">
        <div id="pc-title" class="ai-modal-title">Thêm dấu câu cho phụ đề</div>
        <button type="button" class="ai-modal-close" onclick="closePunctModal()" title="Đóng (Esc)">
          <i data-lucide="x"></i>
        </button>
      </div>
      <p class="ai-step-text">Bấm "Copy prompt" và gửi cho AI (ChatGPT/Claude...). AI sẽ thêm dấu câu, viết hoa và ngắt dòng theo đơn vị phát ngôn tự nhiên (không dịch, giữ nguyên khẩu ngữ), sau đó dán kết quả của AI vào ô bên dưới rồi bấm "Áp dụng":</p>
      <button type="button" class="ai-btn ai-btn-copy" onclick="aiCopy('punct-player', this)">
        <i data-lucide="copy"></i><span>Copy prompt</span>
      </button>
      <textarea id="pc-textarea" class="ai-textarea" spellcheck="false" placeholder="Dán câu trả lời của AI vào đây (có thể dán nguyên cả codebox hoặc toàn bộ phản hồi)..."></textarea>
      <div class="ai-actions">
        <button type="button" class="ai-btn ai-btn-primary" onclick="aiApply('punct-player')">
          <i data-lucide="check"></i><span>Áp dụng</span>
        </button>
        <button type="button" class="ai-btn ai-btn-ghost" onclick="closePunctModal()">Để sau</button>
      </div>
      <div id="pc-status" class="ai-status"></div>
    </div>
  </div>
